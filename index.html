<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日常誌｜個人行程管理</title>
<style>
:root{--bg:#f7f6f2;--ink:#30322e;--muted:#85877f;--green:#687e67;--line:#ecebe5;--soft:#eef2eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}button,input,select{font:inherit}.wrap{max-width:1120px;margin:auto;padding:32px 40px}.top,.brand,.heading,.event,.todo,.formfoot{display:flex;align-items:center}.top{justify-content:space-between;margin-bottom:42px}.brand{gap:11px;font-size:18px;font-weight:700}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--green);color:white}.date{padding:10px 15px;border:1px solid var(--line);border-radius:30px;background:white;color:#62645d;font-size:12px}.welcome{margin-bottom:30px}.eyebrow{color:var(--green);font-size:10px;font-weight:bold;letter-spacing:.16em}h1{margin:9px 0;font-size:clamp(26px,4vw,36px);font-weight:600}.welcome p,.sub{color:var(--muted)}.welcome p{margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:20px}.stat,.panel{border:1px solid var(--line);border-radius:16px;background:white}.stat{padding:17px 19px}.stat label{color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:8px;font-size:24px}.stat strong small{margin-left:7px;color:var(--muted);font-size:11px;font-weight:400}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start}.panel{padding:21px;margin-bottom:18px}.heading{justify-content:space-between;gap:12px;margin-bottom:17px}.heading h2{margin:0;font-size:16px}.sub{margin-top:5px;font-size:11px}.icon{display:grid;place-items:center;width:34px;height:34px;margin-right:10px;border-radius:10px;background:var(--soft);color:var(--green)}.headingcopy{display:flex;align-items:center}.badge{padding:5px 9px;border-radius:20px;background:#f4eacb;color:#92783c;font-size:10px}.schedule{position:relative}.schedule:before{position:absolute;content:"";left:58px;top:12px;bottom:15px;width:1px;background:var(--line)}.event{display:grid;grid-template-columns:46px 12px 1fr;gap:12px;align-items:start;min-height:76px}.time{padding-top:11px;color:#777;font-size:11px}.dot{z-index:1;width:9px;height:9px;margin:15px 0 0 2px;border:2px solid white;border-radius:50%;background:#80917b;outline:1px solid #b8c3b4}.eventbox{padding:11px 13px;margin-bottom:10px;border-radius:10px;background:#f7f7f3}.eventbox h3,.todo h3{margin:0;font-size:12px}.eventbox p{margin:5px 0 0;color:var(--muted);font-size:10px}.eventcontent{display:flex;align-items:center;justify-content:space-between;gap:10px}.delete-event{flex:0 0 auto;padding:5px 8px;border:1px solid #eadfda;border-radius:7px;background:white;color:#a16d5d;font-size:10px}.delete-event:hover{background:#fbf0ec}.edit-event{flex:0 0 auto;padding:5px 8px;border:1px solid #dce5d8;border-radius:7px;background:white;color:var(--green);font-size:10px}.event-actions{display:flex;gap:6px}.edit-event:hover{background:var(--soft)}.edit-event:focus-visible,.delete-event:focus-visible{outline:2px solid var(--green);outline-offset:2px}.delete-event:focus-visible{outline-color:#a16d5d}.formfoot button[hidden]{display:none}.tag{float:right;color:var(--green);font-size:10px}.todos{display:grid;gap:9px}.todo{gap:11px;padding:12px;border:1px solid var(--line);border-radius:11px}.check{width:18px;height:18px;padding:0;border:1px solid #d3d4cc;border-radius:5px;background:white}.todo.done .check{background:var(--green);color:white}.todo.done .check:after{content:"✓"}.todo.done h3{text-decoration:line-through;color:#999}.todoinfo{flex:1}.todoinfo p{margin:5px 0 0;color:var(--muted);font-size:10px}.status{padding:5px 8px;border-radius:20px;background:#e4ecf0;color:#587080;font-size:10px}.status.done{background:var(--soft);color:var(--green)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:600;color:#62645d}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fcfcfa;color:var(--ink)}.formfoot{justify-content:space-between;gap:8px;margin-top:15px}.note{color:#999;font-size:10px}.submit{padding:10px 14px;border:0;border-radius:8px;background:var(--green);color:white}.empty{padding:15px;text-align:center;color:var(--muted);font-size:12px}.toast{position:fixed;right:20px;bottom:20px;padding:12px 17px;border-radius:9px;background:#30372f;color:white;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:760px){.wrap{padding:24px 20px}.grid{grid-template-columns:1fr}}@media(max-width:460px){.wrap{padding:18px 14px}.panel{padding:16px}.stat{padding:13px 10px}.stat strong{font-size:20px}.date{font-size:10px;padding:9px}.brand{font-size:16px}}
</style></head><body><main class="wrap">
<header class="top"><div class="brand"><span class="mark">日</span>日常誌</div><div class="date" id="date"></div></header>
<section class="welcome"><div class="eyebrow">YOUR PERSONAL PLANNER</div><h1>早安，今天也好好安排。</h1><p>把重要的事一件一件完成，留一點從容給自己。</p></section>
<section class="stats"><article class="stat"><label>今日固定行程</label><strong><span id="eventCount">0</span><small>項安排</small></strong></article><article class="stat"><label>尚未完成待辦</label><strong><span id="todoCount">0</span><small>件待辦</small></strong></article><article class="stat"><label>今日完成進度</label><strong><span id="progress">0%</span><small>已完成</small></strong></article></section>
<div class="grid"><section class="panel"><div class="heading"><div class="headingcopy"><span class="icon">◷</span><div><h2>今日固定行程</h2><div class="sub">循著自己的步調，安排每一刻</div></div></div><span class="badge" id="eventBadge">0 項</span></div><div class="schedule" id="events"></div></section>
<div><section class="panel"><div class="heading"><div class="headingcopy"><span class="icon">✓</span><div><h2>今天要完成</h2><div class="sub">小小進度，也是很棒的進度</div></div></div><span class="badge">待辦清單</span></div><div class="todos" id="todos"></div></section>
<section class="panel"><div class="heading"><div class="headingcopy"><span class="icon">＋</span><div><h2 id="form-heading">新增行程</h2><div class="sub">替今天留一個新的位置</div></div></div></div>
<form id="form"><div class="formgrid"><div class="field full"><label for="title">行程名稱</label><input id="title" name="title" placeholder="例如：和朋友喝咖啡" maxlength="60" required></div><div class="field"><label for="day">日期</label><input id="day" name="day" type="date" required></div><div class="field"><label for="time">開始時間</label><input id="time" name="time" type="time" required></div><div class="field full"><label for="category">行程類別</label><select id="category" name="category"><option>個人時間</option><option>工作安排</option><option>健康運動</option><option>學習成長</option><option>社交聚會</option><option>其他</option></select></div></div><div class="formfoot"><span class="note">新增內容儲存在這個瀏覽器</span><button class="submit" id="form-submit" type="submit">＋ 加入行程</button><button class="delete-event" id="cancel-edit" type="button" hidden>取消編輯</button></div></form></section></div></div></main><div id="toast" class="toast" role="status"></div>
<script>
(()=>{const now=new Date(),key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,today=key(now);document.querySelector('#date').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(now);document.querySelector('#day').value=today;
const seedEvents=[['08:30','晨間整理與今日計畫','個人時間'],['10:00','專注工作時段','工作安排'],['12:30','午餐與散步','健康運動'],['15:00','閱讀與自我學習','學習成長'],['18:30','晚間運動','健康運動']].map(([time,title,category])=>({time,title,category,date:today,fixed:true}));const seedTodos=[{title:'整理本週工作進度',detail:'工作安排',status:'進行中',done:false},{title:'完成線上課程第二章',detail:'學習成長',status:'待開始',done:false},{title:'準備明天的會議資料',detail:'工作安排',status:'待開始',done:false},{title:'整理房間與書桌',detail:'生活日常',status:'已完成',done:true}];const load=(k,f)=>{try{const x=JSON.parse(localStorage.getItem(k));return Array.isArray(x)?x:f}catch{return f}};let events=load('planner-events',seedEvents),todos=load('planner-todos',seedTodos),editingEventIndex=null;const fixedDefaults=[['08:30','晨間整理與今日計畫','個人時間'],['10:00','專注工作時段','工作安排'],['12:30','午餐與散步','健康運動'],['15:00','閱讀與自我學習','學習成長'],['18:30','晚間運動','健康運動']];events.forEach(event=>{if(event.fixed===undefined&&fixedDefaults.some(([time,title,category])=>event.time===time&&event.title===title&&event.category===category))event.fixed=true});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2200)}function save(){try{localStorage.setItem('planner-events',JSON.stringify(events));localStorage.setItem('planner-todos',JSON.stringify(todos))}catch{toast('瀏覽器儲存空間無法使用')}}
function render(){const list=events.filter(e=>e.date===today).sort((a,b)=>a.time.localeCompare(b.time));document.querySelector('#events').innerHTML=list.length?list.map(e=>`<article class="event"><time class="time">${esc(e.time)}</time><span class="dot"></span><div class="eventbox"><span class="tag">${esc(e.category)}</span><div class="eventcontent"><h3>${esc(e.title)}</h3>${e.fixed?`<div class="event-actions"><button class="edit-event" type="button" data-event="${events.indexOf(e)}" aria-label="編輯固定行程：${esc(e.title)}">編輯</button><button class="delete-event" type="button" data-event="${events.indexOf(e)}" aria-label="刪除固定行程：${esc(e.title)}">刪除</button></div>`:''}</div><p>${e.fixed?'每日固定安排':'新增行程'}</p></div></article>`).join(''):'<div class="empty">今天還沒有行程，安排一點美好時光吧。</div>';document.querySelector('#todos').innerHTML=todos.length?todos.map((t,i)=>`<article class="todo ${t.done?'done':''}"><button class="check" data-i="${i}" aria-label="切換完成狀態：${esc(t.title)}" aria-pressed="${t.done}"></button><div class="todoinfo"><h3>${esc(t.title)}</h3><p>${esc(t.detail)}</p></div><span class="status ${t.done?'done':''}">${t.done?'已完成':esc(t.status)}</span></article>`).join(''):'<div class="empty">目前沒有待辦事項。</div>';document.querySelector('#eventCount').textContent=list.length;document.querySelector('#eventBadge').textContent=`${list.length} 項`;document.querySelector('#todoCount').textContent=todos.filter(t=>!t.done).length;document.querySelector('#progress').textContent=`${todos.length?Math.round(todos.filter(t=>t.done).length/todos.length*100):0}%`;document.querySelectorAll('.check').forEach(b=>b.onclick=()=>{const t=todos[Number(b.dataset.i)];t.done=!t.done;t.status=t.done?'已完成':'待開始';save();render()});document.querySelectorAll('.edit-event').forEach(b=>b.onclick=()=>{const index=Number(b.dataset.event),event=events[index];if(!event||!event.fixed)return;editingEventIndex=index;document.querySelector('#title').value=event.title;document.querySelector('#day').value=event.date;document.querySelector('#time').value=event.time;document.querySelector('#category').value=event.category;document.querySelector('#form-heading').textContent='編輯固定行程';document.querySelector('#form-submit').textContent='儲存變更';document.querySelector('#cancel-edit').hidden=false;document.querySelector('#form').scrollIntoView({behavior:'smooth',block:'center'});document.querySelector('#title').focus()});document.querySelectorAll('.delete-event').forEach(b=>b.onclick=()=>{const index=Number(b.dataset.event),event=events[index];if(!event||!event.fixed)return;if(!confirm(`確定刪除固定行程「${event.title}」嗎？此操作無法復原。`))return;events.splice(index,1);save();render();toast('固定行程已刪除')})}
const form=document.querySelector('#form'),cancelEdit=document.querySelector('#cancel-edit');function resetForm(){editingEventIndex=null;form.reset();document.querySelector('#day').value=today;document.querySelector('#form-heading').textContent='新增行程';document.querySelector('#form-submit').textContent='＋ 加入行程';cancelEdit.hidden=true}cancelEdit.addEventListener('click',()=>resetForm());form.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(form),updated={title:d.get('title').trim(),date:d.get('day'),time:d.get('time'),category:d.get('category'),fixed:editingEventIndex===null?false:true};if(editingEventIndex!==null){events[editingEventIndex]={...events[editingEventIndex],...updated};save();render();resetForm();toast('固定行程已更新')}else{events.push(updated);save();render();resetForm();toast('行程已成功加入！')}});render()})();
</script></body></html>
