<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - 歡迎頁面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Microsoft JhengHei', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in': 'fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-12px)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gradient-bg {
            background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.05) 50%, transparent 100%);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-500 font-sans selection:bg-indigo-500 selection:text-white relative overflow-x-hidden">

    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-500/20 dark:bg-indigo-600/20 rounded-full blur-3xl animate-pulse-slow"></div>
        <div class="absolute top-1/2 -right-40 w-96 h-96 bg-purple-500/20 dark:bg-purple-600/20 rounded-full blur-3xl animate-pulse-slow" style="animation-delay: 2s;"></div>
        <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-pink-500/20 dark:bg-pink-600/20 rounded-full blur-3xl animate-pulse-slow" style="animation-delay: 1s;"></div>
    </div>

    <header class="relative z-10 w-full max-w-5xl mx-auto px-6 py-6 flex justify-between items-center animate-fade-in">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-code text-lg"></i>
            </div>
            <span class="font-bold text-xl tracking-tight text-slate-800 dark:text-white">WebDev<span class="text-indigo-500">.</span></span>
        </div>

        <button id="themeToggle" class="p-3 rounded-2xl glass-panel text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all duration-300 shadow-sm hover:shadow-md active:scale-95" aria-label="切換主題模式">
            <i class="fa-solid fa-sun hidden dark:block text-amber-400 text-lg"></i>
            <i class="fa-solid fa-moon block dark:hidden text-slate-700 text-lg"></i>
        </button>
    </header>

    <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 py-12 max-w-4xl mx-auto text-center">
        
        <!-- 動畫卡片容器 -->
        <div class="glass-panel p-8 sm:p-12 md:p-16 rounded-3xl shadow-2xl shadow-indigo-500/5 max-w-2xl w-full border border-white/40 dark:border-slate-800/80 animate-fade-in relative overflow-hidden group">
            
            <!-- 卡片頂部裝飾條 -->
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>

            <!-- 圖示與標籤 -->
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 text-xs sm:text-sm font-semibold tracking-wide uppercase mb-8 border border-indigo-100 dark:border-indigo-900/50">
                <span class="w-2 h-2 rounded-full bg-indigo-500 animate-ping"></span>
                歡迎來到網頁世界
            </div>

            <!-- 主標題 -->
            <h1 class="text-5xl sm:text-6xl md:text-7xl font-extrabold tracking-tight mb-6 animate-float">
                <span class="gradient-text">Hello, World!</span>
            </h1>

            <!-- 描述內文 -->
            <p class="text-slate-600 dark:text-slate-300 text-lg sm:text-xl leading-relaxed mb-10 max-w-lg mx-auto font-normal">
                這是您的第一個現代化網頁。每一個偉大的應用程式與精彩的數位旅程，都是從這行簡短而經典的程式碼開始的。
            </p>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <button id="greetBtn" class="w-full sm:w-auto px-8 py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-medium shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40 transition-all duration-300 active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-hand-wave"></i>
                    <span>打個招呼</span>
                </button>
                
                <button id="copyBtn" class="w-full sm:w-auto px-6 py-4 rounded-2xl bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 font-medium transition-all duration-300 border border-slate-200/60 dark:border-slate-700/50 flex items-center justify-center gap-2 active:scale-95">
                    <i class="fa-regular fa-copy"></i>
                    <span id="copyBtnText">複製程式碼</span>
                </button>
            </div>

            <!-- 互動訊息跳出框 -->
            <div id="toastMessage" class="opacity-0 transition-all duration-300 transform translate-y-2 mt-6 p-4 rounded-xl bg-indigo-50 dark:bg-indigo-950/80 text-indigo-700 dark:text-indigo-300 text-sm flex items-center justify-center gap-2 border border-indigo-100 dark:border-indigo-900/50">
                <i class="fa-solid fa-circle-check text-indigo-500"></i>
                <span id="toastText">你好！祝你有個美好的一天！✨</span>
            </div>

        </div>

    </main>

    <footer class="relative z-10 w-full max-w-5xl mx-auto px-6 py-8 text-center text-xs sm:text-sm text-slate-500 dark:text-slate-400 border-t border-slate-200/50 dark:border-slate-800/50">
        <p>設計精心製作 &bull; HTML5 & Tailwind CSS</p>
    </footer>

    <script>
        // 切換主題 (深色 / 淺色模式)
        const themeToggleBtn = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
        });

        // 互動按鈕與 Toast 提示邏輯
        const greetBtn = document.getElementById('greetBtn');
        const copyBtn = document.getElementById('copyBtn');
        const copyBtnText = document.getElementById('copyBtnText');
        const toastMessage = document.getElementById('toastMessage');
        const toastText = document.getElementById('toastText');

        let toastTimeout;

        function showToast(message) {
            toastText.textContent = message;
            toastMessage.classList.remove('opacity-0', 'translate-y-2');
            toastMessage.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastMessage.classList.remove('opacity-100', 'translate-y-0');
                toastMessage.classList.add('opacity-0', 'translate-y-2');
            }, 3000);
        }

        // 打招呼事件
        const greetings = [
            "你好，世界！很高興見到你！✨",
            "歡迎來到前端開發的大門！🚀",
            "每一段精彩程式碼都始於 Hello World！💻",
            "祝你有美好且充滿創意的一天！🌟"
        ];

        greetBtn.addEventListener('click', () => {
            const randomGreeting = greetings[Math.floor(Math.random() * greetings.length)];
            showToast(randomGreeting);
        });

        // 複製代碼事件
        copyBtn.addEventListener('click', () => {
            const codeToCopy = "<h1>Hello, World!</h1>";
            
            // 使用傳統 execCommand 確保兼容性
            const textarea = document.createElement('textarea');
            textarea.value = codeToCopy;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                copyBtnText.textContent = "已複製！";
                showToast("HTML 程式碼已複製到剪貼簿：<h1>Hello, World!</h1>");
                
                setTimeout(() => {
                    copyBtnText.textContent = "複製程式碼";
                }, 2000);
            } catch (err) {
                showToast("複製失敗，請手動複製");
            } finally {
                document.body.removeChild(textarea);
            }
        });
    </script>
</body>
</html>
